services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /work
    volumes:
      # Repo source, live from the host.
      - .:/work
      # Crate sources land here so they are readable on the Windows host
      # under .scratch/cargo-registry/src/ (gitignored).
      - ./.scratch/cargo-registry:/usr/local/cargo/registry
      # Named volume for build artifacts: bind-mounted targets are slow on Windows.
      - starpod-target:/target
    environment:
      CARGO_TARGET_DIR: /target
    command: cargo build --workspace --all-targets

  # Headless UI screenshots into <repo>/shots/ (tools/ui-shot.sh, see its header).
  # Run: docker compose run --rm shot [dashboard|servers|rules|settings|logs]
  shot:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /work
    entrypoint: ["bash", "/work/tools/ui-shot.sh"]
    volumes:
      - .:/work
      - ./.scratch/cargo-registry:/usr/local/cargo/registry
      - starpod-target:/target
    environment:
      CARGO_TARGET_DIR: /target

  # Cross-compiles dist/starpod.exe (x86_64-pc-windows-gnu, mingw-w64).
  # Run: docker compose run --rm windows
  windows:
    build:
      context: .
      dockerfile: Dockerfile.windows
    working_dir: /work
    volumes:
      - .:/work
      - ./.scratch/cargo-registry:/usr/local/cargo/registry
      # Separate target volume so Windows and Linux artifacts never collide.
      - starpod-target-win:/target-win
    environment:
      CARGO_TARGET_DIR: /target-win
    command: ["bash", "/work/tools/build-windows.sh"]

volumes:
  starpod-target:
    name: starpod-target
  starpod-target-win:
    name: starpod-target-win
