name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the release job below needs write access.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.92.0

# Cancel superseded runs for the same branch or pull request. Tag builds are
# never cancelled, so a release run always finishes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: starpod.exe
            name: starpod-windows-x86_64
            archive: starpod-windows-x86_64.zip
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: starpod
            name: starpod-linux-x86_64
            archive: starpod-linux-x86_64.tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            binary: starpod
            name: starpod-macos-aarch64
            archive: starpod-macos-aarch64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libfontconfig1-dev \
            libfreetype-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libdbus-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked -p starpod-app --target ${{ matrix.target }}

      - name: Stage release files
        shell: bash
        env:
          NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          stage="stage/$NAME"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp "target/$TARGET/release/$BINARY" "$stage/"
          cp README.md "$stage/"
          # Include whichever license files exist; none is required.
          for f in LICENSE LICENSE.md LICENSE-MIT LICENSE-APACHE crates/starpod-app/assets/TWEMOJI-LICENSE.txt; do
            if [ -f "$f" ]; then cp "$f" "$stage/$(basename "$f")"; fi
          done
          ls -la "$stage"

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NAME: ${{ matrix.name }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path "stage/$env:NAME" -DestinationPath $env:ARCHIVE -Force

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          NAME: ${{ matrix.name }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          tar -C stage -czf "$ARCHIVE" "$NAME"

      - name: Write SHA-256 checksum
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          # Run from the workspace root so the checksum file names only the archive.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
          cat "$ARCHIVE.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: starpod-*
          path: release
          merge-multiple: true

      - name: Verify checksums
        working-directory: release
        run: sha256sum -c ./*.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          # Tags such as v0.2.0-rc1 are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
