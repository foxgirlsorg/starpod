[package]
name = "starpod-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Persistence, migrations and secret storage for Starpod"

[dependencies]
starpod-core = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
dirs = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }

# --- platform-specific secret storage ---------------------------------------
# Each of these is only pulled in for the platform that uses it, so a Linux
# build never compiles the Keychain bindings and a macOS build never compiles
# the Secret Service D-Bus client.
[target.'cfg(target_os = "windows")'.dependencies]
# DPAPI, the DACL (`SetNamedSecurityInfoW`) and the atomic rename (`MoveFileExW`)
# use the workspace `windows` crate; its features are declared once in the root
# Cargo.toml.
windows = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
