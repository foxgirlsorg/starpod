[package]
name = "starpod-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Android entry point of Starpod: loads the app inside a NativeActivity"
publish = false

# The shared library the Android app loads (android/app, `android.app.lib_name`).
[lib]
name = "starpod"
crate-type = ["cdylib"]
path = "src/lib.rs"

# Only Android builds this crate's code; on other platforms it is an empty
# library, so `cargo build --workspace` still works on the desktop.
[target.'cfg(target_os = "android")'.dependencies]
starpod-app = { workspace = true }
starpod-store = { workspace = true }
starpod-engine = { workspace = true }
slint = { workspace = true, features = ["backend-android-activity-06"] }
# Slint's Android backend needs the activity flavor chosen here: NativeActivity,
# which needs no Java code in the APK.
android-activity = { version = "0.6", features = ["native-activity"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# The VPN: packets from the Android tunnel go to the engine's SOCKS port.
tun2proxy = { version = "0.8.7", default-features = false }
jni = "0.21"
async-trait = { workspace = true }
